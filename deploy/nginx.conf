# Place inside the company's existing HTTPS server block.
# Configure SSO / gateway authorization according to company policy.
# Backend: HOST=127.0.0.1 PORT=8080 BASE_PATH=/aigc-infra/ npm start
location = /aigc-infra {
    return 308 /aigc-infra/;
}
location /aigc-infra/ {
    # No trailing slash: preserve /aigc-infra/ in the upstream request.
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
